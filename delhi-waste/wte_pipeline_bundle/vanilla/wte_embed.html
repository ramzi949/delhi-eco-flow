<!--
================================================================================
WTE Pipeline Viewer — Vanilla HTML/JS Embed
================================================================================

Drop this entire block into any HTML page where you want the interactive viewer.
No build step, no framework required.

REQUIREMENTS:
  1. Place pipeline_web.glb on your server. By default this snippet looks for it
     at the same folder as the HTML page (./pipeline_web.glb). If you put it
     somewhere else, change the MODEL_URL constant in the script below.

  2. This embed uses Three.js loaded from a CDN (jsdelivr). Modern browsers only.

OPTIONAL CUSTOMIZATION:
  - Change the wrapper height by editing the .wte-viewer-wrap height.
  - Change accent color by editing the --wte-accent CSS variable.
  - Remove the side panel by deleting the <aside class="wte-side"> block AND
    changing grid-template-columns to '1fr' in .wte-viewer-wrap.
================================================================================
-->

<div class="wte-viewer-wrap">
  <div class="wte-canvas-col">
    <canvas id="wte-canvas"></canvas>

    <div class="wte-overlay-top">
      <div class="wte-title">The <em>ethical</em><br/>incinerator.</div>
      <div class="wte-sub">Drag · Scroll · Click stages</div>
    </div>

    <button class="wte-rotate-btn" id="wte-rotate-btn">Auto-rotate Off</button>

    <div class="wte-loader" id="wte-loader">
      <div class="wte-spin"></div>
      <div class="wte-loader-pct" id="wte-loader-pct">0%</div>
    </div>
  </div>

  <aside class="wte-side">
    <div class="wte-eyebrow">Pipeline Stages</div>
    <ul class="wte-stages" id="wte-stages"></ul>
    <div class="wte-detail" id="wte-detail"></div>
  </aside>
</div>

<style>
  .wte-viewer-wrap {
    --wte-accent: #7dd190;
    --wte-bg: #0d1411;
    --wte-ink: #e8efe8;
    --wte-ink-dim: #8a978d;
    --wte-ink-faint: #4a5851;
    --wte-line: #2a3631;
    display: grid;
    grid-template-columns: 1fr 320px;
    height: 620px;
    background: var(--wte-bg);
    color: var(--wte-ink);
    border: 1px solid var(--wte-line);
    border-radius: 6px;
    overflow: hidden;
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    position: relative;
  }
  @media (max-width: 800px) {
    .wte-viewer-wrap { grid-template-columns: 1fr; grid-template-rows: 380px 1fr; height: auto; }
    .wte-side { border-left: none; border-top: 1px solid var(--wte-line); max-height: 360px; }
  }
  .wte-canvas-col { position: relative; min-height: 320px; overflow: hidden; }
  #wte-canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  #wte-canvas:active { cursor: grabbing; }

  .wte-overlay-top {
    position: absolute; top: 22px; left: 22px; pointer-events: none;
  }
  .wte-title {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 300;
    font-size: 28px;
    line-height: 1;
    letter-spacing: -0.025em;
  }
  .wte-title em { color: var(--wte-accent); font-style: italic; }
  .wte-sub {
    font-size: 9.5px;
    letter-spacing: 0.3em;
    color: var(--wte-ink-dim);
    text-transform: uppercase;
    margin-top: 10px;
  }

  .wte-rotate-btn {
    position: absolute; bottom: 20px; right: 20px;
    background: rgba(20,28,23,0.78);
    border: 1px solid var(--wte-line);
    color: var(--wte-ink-dim);
    padding: 9px 15px;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: all 0.2s;
  }
  .wte-rotate-btn:hover { color: var(--wte-accent); border-color: var(--wte-accent); }
  .wte-rotate-btn.active {
    color: var(--wte-accent);
    border-color: var(--wte-accent);
    background: rgba(125,209,144,0.12);
  }

  .wte-loader {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: var(--wte-bg);
    z-index: 5;
    transition: opacity 0.4s, visibility 0.4s;
    flex-direction: column;
    gap: 18px;
  }
  .wte-loader.hidden { opacity: 0; visibility: hidden; }
  .wte-spin {
    width: 36px; height: 36px;
    border: 1.5px solid var(--wte-line);
    border-top-color: var(--wte-accent);
    border-radius: 50%;
    animation: wte-spin 1.1s linear infinite;
  }
  .wte-loader-pct {
    margin-top: 16px;
    font-family: 'Fraunces', Georgia, serif;
    font-size: 20px;
    color: var(--wte-accent);
  }
  @keyframes wte-spin { to { transform: rotate(360deg); } }

  .wte-side {
    border-left: 1px solid var(--wte-line);
    padding: 24px 20px;
    overflow-y: auto;
    background: rgba(13,20,17,0.45);
  }
  .wte-eyebrow {
    font-size: 9.5px;
    letter-spacing: 0.3em;
    color: var(--wte-accent);
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .wte-stages { list-style: none; padding: 0; margin: 0 0 24px 0; }
  .wte-stage {
    padding: 12px 0 12px 18px;
    border-left: 1.5px solid var(--wte-line);
    position: relative;
    cursor: pointer;
    transition: all 0.2s;
  }
  .wte-stage:hover { border-left-color: var(--wte-accent); }
  .wte-stage.active { border-left-color: var(--wte-accent); }
  .wte-stage::before {
    content: '';
    position: absolute; left: -5px; top: 18px;
    width: 8px; height: 8px;
    background: var(--wte-bg);
    border: 1.5px solid var(--wte-line);
    border-radius: 50%;
    transition: all 0.2s;
  }
  .wte-stage.active::before {
    background: var(--wte-accent);
    border-color: var(--wte-accent);
    box-shadow: 0 0 0 4px rgba(125,209,144,0.18);
  }
  .wte-stage-num {
    font-size: 8.5px;
    letter-spacing: 0.3em;
    color: var(--wte-ink-faint);
    text-transform: uppercase;
  }
  .wte-stage-name {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 400;
    font-size: 14px;
    margin-top: 3px;
    letter-spacing: -0.005em;
  }

  .wte-detail {
    border-top: 1px solid var(--wte-line);
    padding-top: 18px;
    font-size: 11px;
    line-height: 1.65;
    font-weight: 300;
  }
  .wte-detail p { margin: 0 0 16px 0; }
  .wte-item {
    padding: 9px 0 9px 12px;
    border-left: 2px solid;
    margin-bottom: 6px;
  }
  .wte-item strong {
    display: block;
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: 12.5px;
    margin-bottom: 3px;
    letter-spacing: -0.005em;
  }
  .wte-item span {
    color: var(--wte-ink-dim);
    font-size: 10.5px;
    line-height: 1.55;
  }
</style>

<!-- Three.js as ES module -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ============================================================================
// CONFIG — change MODEL_URL if your GLB lives elsewhere on your site
// ============================================================================
const MODEL_URL = './pipeline_web.glb';

const STAGES = [
  {
    id: 1, label: 'Stage 01', title: 'Three input streams.',
    body: 'Waste is separated at the source into three streams. Each is processed by a dedicated facility designed to extract maximum value before anything reaches thermal recovery.',
    cameraPos: [-100, 80, 140], cameraTarget: [-65, 25, 0],
    items: [
      { color: '#5fb874', name: 'Organic / Wet Waste', desc: 'Routed to a biogas digester producing cooking gas + compost. Nothing is burned.' },
      { color: '#4a90c2', name: 'Dry Waste', desc: 'Paper, plastic, metal, glass — hand-sorted and sent to recycling centres.' },
      { color: '#d97a3a', name: 'Hazardous Waste', desc: 'Batteries, medicines, chemicals — sealed in containment drums.' },
    ],
  },
  {
    id: 2, label: 'Stage 02', title: 'Only the residual reaches the incinerator.',
    body: 'Each processing unit sends only its non-recoverable remainder to a central junction, which feeds the incinerator. Typically 15–25% of original waste mass by this stage.',
    cameraPos: [-10, 70, 130], cameraTarget: [-5, 20, 0],
    items: [
      { color: '#8a978d', name: 'Residual Junction', desc: 'Where the three residual flows merge.' },
      { color: '#8a978d', name: 'Feed to WTE', desc: 'Metered into the primary chamber, combusted at 850–1100°C.' },
    ],
  },
  {
    id: 3, label: 'Stage 03', title: 'A triple-layer filtration tower.',
    body: 'Hot flue gas rises through three sequential treatment stages. No untreated gas ever reaches the stack.',
    cameraPos: [120, 110, 130], cameraTarget: [25, 50, 0],
    items: [
      { color: '#c9a85c', name: '1. Particulate Filter (ESP)', desc: 'Traps fly ash, soot, and PM2.5 on charged plates.' },
      { color: '#b88dc4', name: '2. Acid Gas Scrubber', desc: 'Lime spray neutralises HCl, SO₂, HF into harmless calcium salts.' },
      { color: '#6ec0c8', name: '3. Carbon Capture', desc: 'Amine solvent binds CO₂ for storage or industrial reuse.' },
    ],
  },
  {
    id: 4, label: 'Stage 04', title: 'Clean air. Clean energy.',
    body: 'After three filtration stages, what exits the tower is essentially scrubbed air. The thermal energy is converted to electricity and fed to the grid.',
    cameraPos: [160, 70, 100], cameraTarget: [50, 30, 0],
    items: [
      { color: '#7dd190', name: 'Clean Air Output', desc: 'Continuously monitored against CPCB emission standards.' },
      { color: '#f4d35e', name: 'Electricity Output', desc: 'Steam turbine generates power fed into the Delhi grid.' },
    ],
  },
];

// ============================================================================
// SIDE PANEL — populate stage list and detail
// ============================================================================
const stageListEl = document.getElementById('wte-stages');
const detailEl = document.getElementById('wte-detail');

function renderStageList(activeId) {
  stageListEl.innerHTML = STAGES.map((s) => `
    <li class="wte-stage ${s.id === activeId ? 'active' : ''}" data-stage="${s.id}">
      <div class="wte-stage-num">${s.label}</div>
      <div class="wte-stage-name">${s.title}</div>
    </li>
  `).join('');
  stageListEl.querySelectorAll('.wte-stage').forEach((el) => {
    el.addEventListener('click', () => selectStage(parseInt(el.dataset.stage)));
  });
}

function renderDetail(stage) {
  detailEl.innerHTML = `
    <p>${stage.body}</p>
    ${stage.items.map((it) => `
      <div class="wte-item" style="border-left-color: ${it.color};">
        <strong>${it.name}</strong>
        <span>${it.desc}</span>
      </div>
    `).join('')}
  `;
}

function selectStage(id) {
  const stage = STAGES.find((s) => s.id === id);
  renderStageList(id);
  renderDetail(stage);
  animateCameraTo(stage.cameraPos, stage.cameraTarget);
}

renderStageList(1);
renderDetail(STAGES[0]);

// ============================================================================
// THREE.JS SETUP
// ============================================================================
const canvas = document.getElementById('wte-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x131c17, 250, 600);

const camera = new THREE.PerspectiveCamera(35, 1, 0.5, 2000);
camera.position.set(180, 140, 200);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 60;
controls.maxDistance = 450;
controls.maxPolarAngle = Math.PI * 0.49;
controls.target.set(0, 30, 0);

// Lights
scene.add(new THREE.AmbientLight(0xc8d4cc, 0.35));
const key = new THREE.DirectionalLight(0xfff0d4, 1.4);
key.position.set(140, 220, 100);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -200; key.shadow.camera.right = 200;
key.shadow.camera.top = 200; key.shadow.camera.bottom = -200;
key.shadow.camera.near = 0.5; key.shadow.camera.far = 700;
key.shadow.bias = -0.0005;
scene.add(key);
const fill = new THREE.DirectionalLight(0x88a8c8, 0.55);
fill.position.set(-150, 100, -60);
scene.add(fill);
const rim = new THREE.DirectionalLight(0x5fb874, 0.45);
rim.position.set(0, 60, -200);
scene.add(rim);
scene.add(new THREE.HemisphereLight(0xb0d0b8, 0x1a241e, 0.35));

// Shadow plane
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(800, 800),
  new THREE.ShadowMaterial({ opacity: 0.32 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.05;
ground.receiveShadow = true;
scene.add(ground);

// Grid
const grid = new THREE.GridHelper(800, 40, 0x2a3631, 0x1a241e);
scene.add(grid);

// ============================================================================
// LOAD MODEL
// ============================================================================
const loaderEl = document.getElementById('wte-loader');
const pctEl = document.getElementById('wte-loader-pct');

new GLTFLoader().load(
  MODEL_URL,
  (gltf) => {
    const model = gltf.scene;
    model.rotation.x = -Math.PI / 2;

    const bbox = new THREE.Box3().setFromObject(model);
    const center = bbox.getCenter(new THREE.Vector3());
    model.position.x -= center.x;
    model.position.z -= center.z;
    model.position.y -= bbox.min.y;

    const material = new THREE.MeshStandardMaterial({
      color: 0xc8cfc8, roughness: 0.78, metalness: 0.08,
    });
    model.traverse((c) => {
      if (c.isMesh) { c.material = material; c.castShadow = true; c.receiveShadow = true; }
    });

    scene.add(model);
    loaderEl.classList.add('hidden');
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      pctEl.textContent = Math.round((xhr.loaded / xhr.total) * 100) + '%';
    }
  },
  (err) => {
    console.error('Failed to load model:', err);
    loaderEl.innerHTML = '<div style="color:#8a978d;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;text-align:center;padding:20px;">Model not found.<br/><br/><span style="color:#7dd190;">Place pipeline_web.glb next to this page.</span></div>';
  }
);

// ============================================================================
// CAMERA ANIMATION
// ============================================================================
let animId = null;
function animateCameraTo(targetPos, targetLook, duration = 1100) {
  if (animId) cancelAnimationFrame(animId);
  const startPos = camera.position.clone();
  const startTarget = controls.target.clone();
  const endPos = new THREE.Vector3(...targetPos);
  const endTarget = new THREE.Vector3(...targetLook);
  const startTime = performance.now();
  const ease = (t) => (t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2);
  const tick = () => {
    const t = Math.min((performance.now() - startTime) / duration, 1);
    const e = ease(t);
    camera.position.lerpVectors(startPos, endPos, e);
    controls.target.lerpVectors(startTarget, endTarget, e);
    controls.update();
    if (t < 1) animId = requestAnimationFrame(tick);
  };
  tick();
}

// Auto-rotate toggle
const rotateBtn = document.getElementById('wte-rotate-btn');
rotateBtn.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  controls.autoRotateSpeed = 0.6;
  rotateBtn.classList.toggle('active', controls.autoRotate);
  rotateBtn.textContent = 'Auto-rotate ' + (controls.autoRotate ? 'On' : 'Off');
});

// Resize handling
function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(rect.width, rect.height, false);
  camera.aspect = rect.width / rect.height;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
new ResizeObserver(resize).observe(canvas.parentElement);
resize();

// Render loop
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
